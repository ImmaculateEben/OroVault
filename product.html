<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — OroVault</title>
  <meta name="description" content="Explore premium timepieces at OroVault. Authentic watches with detailed specs, high-resolution images, and secure checkout.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#C9A84C',
            'gold-light': '#E0C97F',
            'gold-dark': '#A68A3E',
            dark: '#0D0D0D',
            'dark-light': '#1A1A1A',
            'dark-lighter': '#2A2A2A',
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[var(--dark)] text-[var(--white)] font-sans">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Product Content -->
  <section class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="product-content">
        <!-- Filled by JS -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
          <div class="skeleton aspect-square rounded-xl"></div>
          <div>
            <div class="skeleton h-4 w-24 mb-3"></div>
            <div class="skeleton h-8 w-64 mb-4"></div>
            <div class="skeleton h-4 w-48 mb-6"></div>
            <div class="skeleton h-6 w-32 mb-6"></div>
            <div class="skeleton h-20 w-full mb-6"></div>
            <div class="skeleton h-12 w-full"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h2 class="font-serif text-2xl font-bold mb-8">You May Also Like</h2>
      <div id="related-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Filled by JS -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/app.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
