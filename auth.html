<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account — OroVault</title>
  <meta name="description" content="Sign in or create your OroVault account. Track orders, manage your wishlist, and enjoy a personalised shopping experience.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#C9A84C',
            'gold-light': '#E0C97F',
            'gold-dark': '#A68A3E',
            dark: '#0D0D0D',
            'dark-light': '#1A1A1A',
            'dark-lighter': '#2A2A2A',
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0D0D0D] text-[#F5F5F5] font-sans">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Auth Section -->
  <section class="pt-28 pb-20 min-h-screen flex items-center">
    <div class="max-w-md mx-auto px-4 w-full">
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-2 mb-6">
          <svg class="w-8 h-8 text-[#C9A84C]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
          <span class="font-serif text-2xl font-bold text-white">CHRONO<span class="text-[#C9A84C]">LUXE</span></span>
        </a>
      </div>

      <div class="bg-[#1A1A1A] rounded-xl border border-[#2A2A2A] overflow-hidden">
        <!-- Tabs -->
        <div class="grid grid-cols-2">
          <button id="login-tab" class="auth-tab active py-4 text-sm uppercase tracking-wider font-semibold text-center transition-colors">Login</button>
          <button id="register-tab" class="py-4 text-sm uppercase tracking-wider font-semibold text-center text-[#888] transition-colors hover:text-white">Register</button>
        </div>

        <div class="p-6">
          <!-- Login Form -->
          <form id="login-form" class="space-y-4">
            <div>
              <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Email Address</label>
              <input type="email" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm" placeholder="john@example.com">
            </div>
            <div>
              <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Password</label>
              <div class="relative">
                <input type="password" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm pr-12" placeholder="••••••••">
                <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-[#888] hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="filter-checkbox w-4 h-4 rounded">
                <span class="text-[#888] text-sm">Remember me</span>
              </label>
              <a href="#" class="text-[#C9A84C] text-sm hover:underline">Forgot password?</a>
            </div>
            <button type="submit" class="btn-gold w-full text-[#0D0D0D] py-3 rounded-lg text-sm uppercase tracking-wider font-bold">
              Sign In
            </button>
          </form>

          <!-- Register Form (hidden by default) -->
          <form id="register-form" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">First Name</label>
                <input type="text" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm" placeholder="John">
              </div>
              <div>
                <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Last Name</label>
                <input type="text" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm" placeholder="Doe">
              </div>
            </div>
            <div>
              <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Email Address</label>
              <input type="email" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm" placeholder="john@example.com">
            </div>
            <div>
              <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Password</label>
              <div class="relative">
                <input type="password" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm pr-12" placeholder="••••••••">
                <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-[#888] hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="text-[#888] text-xs uppercase tracking-wider mb-1 block">Confirm Password</label>
              <div class="relative">
                <input type="password" required class="w-full bg-[#0D0D0D] border border-[#2A2A2A] rounded-lg px-4 py-3 text-white text-sm pr-12" placeholder="••••••••">
                <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-[#888] hover:text-white transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" required class="filter-checkbox w-4 h-4 rounded">
              <span class="text-[#888] text-sm">I agree to the <a href="#" class="text-[#C9A84C] hover:underline">Terms & Conditions</a></span>
            </label>
            <button type="submit" class="btn-gold w-full text-[#0D0D0D] py-3 rounded-lg text-sm uppercase tracking-wider font-bold">
              Create Account
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
